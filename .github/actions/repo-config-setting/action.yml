name: repo-config-setting
description: Reconcile repository settings from .github/repo-config/repo-config.json

inputs:
  token:
    description: App installation token with Administration:write.
    required: true
  repository:
    description: owner/repo to reconcile.
    default: ${{ github.repository }}
  config:
    description: Path to repo-config.json.
    default: .github/repo-config/repo-config.json
  mode:
    description: plan (detect only) or apply (reconcile).
    required: true

outputs:
  drift:
    description: true when live state diverged from config.
    value: ${{ steps.plan.outputs.drift }}

runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repository }}
        CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        work="${RUNNER_TEMP}/repo-config"
        mkdir -p "$work"
        jq '.settings' "$CONFIG" > "$work/settings.input.json"

        # Config must cover the whole writable surface. Without this, adding a
        # field to GitHub's API silently widens the unmanaged area and nothing
        # ever reports it.
        undeclared=$(jq -r --slurpfile w "${{ github.action_path }}/../repo-config-lib/settings-writable.json" \
          '. as $cfg | $w[0].writable[] as $k | select(($cfg | has($k)) | not) | $k' "$work/settings.input.json")
        if [ -n "$undeclared" ]; then
          echo "::error title=Settings config is not exhaustive::these writable fields are undeclared"
          echo "$undeclared" | sed 's/^/  undeclared: /'
          exit 1
        fi

        gh api "repos/$REPO" > "$work/settings.live.json"
        "${{ github.action_path }}/../repo-config-lib/drift.sh" \
          settings "$work/settings.input.json" "$work/settings.live.json"

    - id: apply
      if: inputs.mode == 'apply' && steps.plan.outputs.drift == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        work="${RUNNER_TEMP}/repo-config"
        echo "Applying repository settings to $REPO"
        # Strip fields that are declarable but not patchable. One of them in
        # the body 422s the whole request, taking every other field with it.
        jq --slurpfile w "${{ github.action_path }}/../repo-config-lib/settings-writable.json" \
          'delpaths([$w[0].never_patch[] | [.]])' \
          "$work/settings.input.json" > "$work/settings.patch.json"
        gh api -X PATCH "repos/$REPO" --input "$work/settings.patch.json" > /dev/null

        # Re-read and re-diff: proves convergence rather than assuming the
        # PATCH did what was asked. Some fields return 200 and change nothing.
        #
        # Retried, because the read-back is not immediately consistent —
        # dependabot_security_updates in particular reports its old value for
        # a second or so after a successful write.
        lib="${{ github.action_path }}/../repo-config-lib"
        for attempt in 1 2 3 4 5; do
          gh api "repos/$REPO" > "$work/settings.live.json"
          GITHUB_OUTPUT=/dev/null GITHUB_STEP_SUMMARY=/dev/null \
            "$lib/drift.sh" settings "$work/settings.input.json" "$work/settings.live.json" \
            > /dev/null 2>&1 || true
          [ -s "$work/settings.diff" ] || break
          echo "not converged yet (attempt $attempt) — retrying"
          sleep 3
        done

        if [ -s "$work/settings.diff" ]; then
          echo "::error title=Settings did not converge::PATCH was accepted but live state still differs after 5 reads — the field is probably not settable on this repo"
          cat "$work/settings.diff"
          exit 1
        fi
        echo "settings: converged"
