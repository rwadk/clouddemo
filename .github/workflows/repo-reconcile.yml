name: Repo reconciliation

# Declared repo state lives in .github/repo-config/. This workflow is the only
# thing that should be changing it.
#
#   schedule       plan  — nightly drift detection, FAILS if reality moved
#   pull_request   plan  — shows what merging would change, never fails
#   push to main   apply — reconciles
#   dispatch       either

on:
  schedule:
    # 03:17 UTC — off the hour, where GitHub's scheduler is least congested.
    - cron: '17 3 * * *'
  pull_request:
    paths:
      - '.github/repo-config/**'
      - '.github/actions/repo-config-*/**'
      - '.github/workflows/repo-reconcile.yml'
  push:
    branches: [main]
    paths:
      - '.github/repo-config/**'
      - '.github/actions/repo-config-*/**'
      - '.github/workflows/repo-reconcile.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: plan (detect only) or apply (reconcile)
        type: choice
        options: [plan, apply]
        default: plan

# Never let a nightly run and a merge mutate settings at the same time.
concurrency:
  group: repo-config
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    name: reconcile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN cannot do any of this: there is no `administration`
      # scope available to it. Hence the App.
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REPO_RECONCILIATOR_APP_ID }}
          private-key: ${{ secrets.REPO_RECONCILIATOR_APP_KEY }}

      - id: mode
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            push)              mode=apply; fail=false ;;
            pull_request)      mode=plan;  fail=false ;;
            schedule)          mode=plan;  fail=true  ;;
            workflow_dispatch) mode="${{ inputs.mode }}"
                               [ "$mode" = plan ] && fail=true || fail=false ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          echo "mode=$mode fail_on_drift=$fail" >> "$GITHUB_STEP_SUMMARY"

      - id: setting
        uses: ./.github/actions/repo-config-setting
        continue-on-error: true
        with:
          token: ${{ steps.app-token.outputs.token }}
          mode: ${{ steps.mode.outputs.mode }}

      - id: actions-permissions
        uses: ./.github/actions/repo-config-actions-permissions
        continue-on-error: true
        with:
          token: ${{ steps.app-token.outputs.token }}
          mode: ${{ steps.mode.outputs.mode }}

      - id: variables-secrets
        uses: ./.github/actions/repo-config-variables-secrets
        continue-on-error: true
        with:
          token: ${{ steps.app-token.outputs.token }}
          mode: ${{ steps.mode.outputs.mode }}

      - id: environments
        uses: ./.github/actions/repo-config-environments
        continue-on-error: true
        with:
          token: ${{ steps.app-token.outputs.token }}
          mode: ${{ steps.mode.outputs.mode }}

      # Last on purpose: the ruleset is the one resource that can lock the
      # door on every step above it. Everything else has already converged
      # by the time it runs.
      - id: ruleset
        uses: ./.github/actions/repo-config-ruleset
        continue-on-error: true
        with:
          token: ${{ steps.app-token.outputs.token }}
          mode: ${{ steps.mode.outputs.mode }}

      # The paste-back path: download, drop into .github/repo-config/, commit.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-config-live-state
          path: ${{ runner.temp }}/repo-config/*.actual.json
          if-no-files-found: warn

      # Every action runs with continue-on-error so one drifted resource does
      # not hide the other four. Aggregation and the single failure happen here.
      - name: Report
        id: report
        if: always()
        shell: bash
        env:
          DRIFT: ${{ toJSON(steps.*.outputs.drift) }}
          OUTCOMES: ${{ toJSON(steps.*.outcome) }}
        run: |
          set -euo pipefail
          echo "drift by step: $DRIFT"
          echo "outcomes:      $OUTCOMES"
          any=$(echo "$DRIFT" | jq -r 'map(select(. == "true")) | length > 0')
          failed=$(echo "$OUTCOMES" | jq -r 'map(select(. == "failure")) | length > 0')
          echo "any_drift=$any"   >> "$GITHUB_OUTPUT"
          echo "any_failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Fail on drift
        if: always() && steps.mode.outputs.fail == 'true' && steps.report.outputs.any_drift == 'true'
        shell: bash
        run: |
          echo "::error title=Repo config drift::live state diverged from .github/repo-config/ — download the artifact and commit it to accept, or re-run in apply mode to reconcile"
          exit 1

      - name: Fail on action error
        if: always() && steps.report.outputs.any_failed == 'true'
        shell: bash
        run: |
          echo "::error title=Reconciliation error::a step failed outright — see the logs above"
          exit 1
